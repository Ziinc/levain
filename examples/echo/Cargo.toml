[package]
name = "levain-echo"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Serves the app's windows to Playwright clients when GPUI_PLAYWRIGHT is set.
playwright = ["levain/playwright"]

[dependencies]
levain = { path = "../../levain" }
serde_json = "1"
tauri = { version = "2.12", default-features = false }
