[package]
name = "levain-pack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Packages apps around a levain host: precompiled assets, desktop bundles, Android and iOS projects"

[[bin]]
name = "levain-pack"
path = "src/main.rs"

[dependencies]
flate2 = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "proxy-from-env"] }

[dev-dependencies]
tempfile = "3"
