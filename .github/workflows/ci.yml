name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit tests on the three desktop platforms.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      # Check out files as committed (LF), as tests read some of them.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libgbm-dev \
            libegl-dev libxrandr-dev clang
      # Formatting does not vary by platform: one job checks it.
      - if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
        shell: bash
      - run: cargo clippy -p levain --all-targets --features playwright -- -D warnings
        shell: bash
      - run: cargo test --workspace
        shell: bash

  # Lint rules (ast-grep), spelling, unused dependencies and the dependency
  # policy. None of it compiles the workspace, so no system libraries.
  # Every check runs even if an earlier one fails (!cancelled()).
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install typos, cargo-machete and cargo-deny
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: typos@1.52.2,cargo-machete@0.9.2,cargo-deny@0.20.2
      - name: Install ast-grep
        run: npm install --global @ast-grep/cli@0.38.7
      # The rules' own tests (lint/ast-grep/__tests__), then the rules over the code.
      - name: ast-grep test
        if: ${{ !cancelled() }}
        run: ast-grep test
      - name: ast-grep scan
        if: ${{ !cancelled() }}
        run: ast-grep scan
      - name: typos
        if: ${{ !cancelled() }}
        run: typos
      - name: cargo machete
        if: ${{ !cancelled() }}
        run: cargo machete
      - name: cargo deny
        if: ${{ !cancelled() }}
        run: cargo deny --locked check

  # Phones run no unit tests here: every crate must build for them.
  ios:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --exclude levain-pack --target ${{ matrix.target }}

  android:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.abi }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK and cargo-ndk
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - run: cargo ndk -t ${{ matrix.abi }} build --workspace --exclude levain-pack
