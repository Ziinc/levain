name: Coverage

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Lines covered, in percent, below which the job fails. Raise it as tests
  # are added; never lower it to get a change through.
  MIN_LINE_COVERAGE: 25
  # levain/src/style_gen.rs is generated (from gpui's rustdoc).
  IGNORE: levain/src/style_gen\.rs

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libgbm-dev \
            libegl-dev libxrandr-dev clang
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run the tests, instrumented
        run: cargo llvm-cov --workspace --no-report
      - name: Summary
        run: |
          cargo llvm-cov report --summary-only --ignore-filename-regex "$IGNORE" | tee summary.txt
          {
            echo '## Coverage'
            echo
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the floor
        run: cargo llvm-cov report --ignore-filename-regex "$IGNORE" --fail-under-lines "$MIN_LINE_COVERAGE" > /dev/null
